  <title id="title">100 Clocks · 时间实验室 — 时间，不止一种走法</title>
  <desc id="desc">暖纸底标题：100 Clocks 时间实验室；右侧是指针矩阵示意，9×5 个小表盘拼出数字 10，空白表盘指针整齐朝上。</desc>

