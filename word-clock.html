<!DOCTYPE html>
<html lang="zh-CN" data-theme="amber" data-lang="zh">
<head>
<script
  defer
  src="https://cloud.umami.is/script.js"
  data-website-id="e01c9f78-4607-4e60-b01c-77c8190b12b4"
  data-domains="holynova.github.io"
  data-exclude-search="true"
  data-exclude-hash="true"
></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Clock · 文字时钟</title>
<style>
  :root { --size: min(92vmin, 620px); --faint: #6b6b72; --hair: #2b2b30; }
  /* 主题色：与 Matrix 时钟一致的荧光配色 */
  [data-theme="amber"] { --c: #ffaa00; --dim: rgba(255,170,0,.22);  --glow: rgba(255,170,0,.55); }
  [data-theme="green"] { --c: #00ff41; --dim: rgba(0,255,65,.20);   --glow: rgba(0,255,65,.55); }
  [data-theme="blue"]  { --c: #00f3ff; --dim: rgba(0,243,255,.20);  --glow: rgba(0,243,255,.55); }
  [data-theme="red"]   { --c: #ff003c; --dim: rgba(255,0,60,.22);   --glow: rgba(255,0,60,.55); }
  [data-theme="white"] { --c: #f5f5f5; --dim: rgba(255,255,255,.16); --glow: rgba(255,255,255,.45); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0a0a0c;
    background-image: radial-gradient(circle at 50% 42%, #17171b 0%, #060607 75%);
    color: var(--c);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Avenir Next", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    transition: background .3s, color .3s;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
  }

  /* 顶部导航 / 工具条：极简 */
  .nav {
    position: fixed;
    top: 18px;
    left: 22px;
    display: flex;
    gap: 14px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 10;
  }
  .nav a {
    color: var(--faint);
    text-decoration: none;
    transition: color .2s;
  }
  .nav a:hover { color: var(--c); }
  .nav .current { color: var(--c); cursor: default; }

  .tools {
    position: fixed;
    top: 14px;
    right: 18px;
    display: flex;
    gap: 8px;
    z-index: 10;
  }
  .seg {
    display: flex;
    border: 1px solid var(--hair);
    border-radius: 999px;
    overflow: hidden;
  }
  .seg button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--faint);
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 1px;
    padding: 7px 13px;
    cursor: pointer;
    transition: color .2s, background .2s;
  }
  .seg button.active { background: var(--c); color: #0a0a0c; font-weight: 700; }
  .seg button:not(.active):hover { color: var(--c); }
  .dots { display: flex; align-items: center; gap: 9px; padding: 0 4px 0 10px; }
  .dot {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer;
    transition: transform .2s, border-color .2s, box-shadow .2s;
  }
  .dot:hover { transform: scale(1.25); }
  .dot.active { border-color: #fff; box-shadow: 0 0 10px currentColor; }
  .dot[data-t="amber"] { background: #ffaa00; color: #ffaa00; }
  .dot[data-t="green"] { background: #00ff41; color: #00ff41; }
  .dot[data-t="blue"]  { background: #00f3ff; color: #00f3ff; }
  .dot[data-t="red"]   { background: #ff003c; color: #ff003c; }
  .dot[data-t="white"] { background: #f5f5f5; color: #f5f5f5; }

  .stage {
    width: var(--size);
    padding: calc(var(--size) * 0.05);
  }
  .grid-wrap { position: relative; }
  /* 1分钟模式：四角圆点表示 +1~4 分钟 */
  .cdot {
    position: absolute;
    width: max(6px, calc(var(--size) * 0.016));
    height: max(6px, calc(var(--size) * 0.016));
    border-radius: 50%;
    background: var(--dim);
    opacity: .45;
    transition: background .3s, box-shadow .3s, opacity .3s;
  }
  .cdot.on {
    background: var(--c);
    opacity: 1;
    box-shadow: 0 0 calc(var(--size) * 0.02) var(--glow),
                0 0 calc(var(--size) * 0.045) var(--glow);
  }
  #cdot0 { top: calc(var(--size) * -0.035); left: calc(var(--size) * -0.035); }
  #cdot1 { top: calc(var(--size) * -0.035); right: calc(var(--size) * -0.035); }
  #cdot2 { bottom: calc(var(--size) * -0.035); right: calc(var(--size) * -0.035); }
  #cdot3 { bottom: calc(var(--size) * -0.035); left: calc(var(--size) * -0.035); }
  .grid {
    display: grid;
    grid-template-columns: repeat(11, 1fr);
    gap: calc(var(--size) * 0.014);
    width: 100%;
  }
  .cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--size) / 16);
    font-weight: 600;
    color: var(--dim);
    user-select: none;
    transition: color .3s, text-shadow .3s;
    line-height: 1;
  }
  html[data-lang="zh"] .cell {
    font-size: calc(var(--size) / 13.5);
    font-weight: 500;
  }
  .cell.on {
    color: var(--c);
    font-weight: 700;
    text-shadow: 0 0 calc(var(--size) * 0.012) var(--glow),
                 0 0 calc(var(--size) * 0.035) var(--glow),
                 0 0 calc(var(--size) * 0.075) var(--glow);
  }

  .hint {
    margin-top: calc(var(--size) * 0.05);
    text-align: center;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--faint);
  }

  /* 读秒：文字拼读 */
  .sec { display: flex; align-items: center; justify-content: center; margin-top: calc(var(--size) * 0.035); }
  .sec[hidden] { display: none; }
  .sec-words {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 5px;
    text-indent: 5px;
    color: var(--c);
    text-shadow: 0 0 10px var(--glow), 0 0 26px var(--glow);
    white-space: nowrap;
  }
  html[data-lang="zh"] .sec-words { letter-spacing: 9px; text-indent: 9px; }

  /* 底部控制条：精度 + 读秒开关 */
  .controls {
    position: fixed;
    bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center; z-index: 10;
  }
  .pill {
    appearance: none; border: 1px solid var(--hair); border-radius: 999px;
    background: transparent; color: var(--faint);
    font-family: inherit; font-size: 12px; letter-spacing: 1px;
    padding: 7px 14px; cursor: pointer; transition: all .2s; white-space: nowrap;
  }
  .pill.active { background: var(--c); border-color: var(--c); color: #0a0a0c; font-weight: 700; }
  .pill:not(.active):hover { color: var(--c); border-color: var(--faint); }

  @media (max-width: 480px) {
    .nav { left: 16px; top: 14px; gap: 10px; }
    .tools { right: 12px; top: 10px; }
  }
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html">Matrix</a>
  <a href="clock3.html">Sport</a>
  <span class="current">Word</span>
</nav>

<div class="tools">
  <div class="seg">
    <button id="langZh" class="active">中文</button>
    <button id="langEn">EN</button>
  </div>
  <div class="dots" id="themeDots" title="切换主题">
    <div class="dot" data-t="amber" title="琥珀"></div>
    <div class="dot" data-t="green" title="荧光绿"></div>
    <div class="dot" data-t="blue" title="冰蓝"></div>
    <div class="dot" data-t="red" title="霓虹红"></div>
    <div class="dot" data-t="white" title="月白"></div>
  </div>
</div>

<div class="stage">
  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
    <div class="cdot" id="cdot0"></div>
    <div class="cdot" id="cdot1"></div>
    <div class="cdot" id="cdot2"></div>
    <div class="cdot" id="cdot3"></div>
  </div>
  <div class="hint" id="hint">五分钟精度</div>
  <div class="sec" id="secRow" hidden>
    <div class="sec-words" id="secWords"></div>
  </div>
</div>

<div class="controls">
  <div class="seg" id="precSeg">
    <button data-p="1">1分</button>
    <button data-p="5" class="active">5分</button>
    <button data-p="10">10分</button>
    <button data-p="15">15分</button>
  </div>
  <button class="pill" id="secToggle">读秒 关</button>
  <button class="pill" id="debugToggle">调试 关</button>
</div>

<script>
(function () {
  "use strict";

  var EN_ROWS = [
    "ITLISASTHPM",
    "ACFIFTEENDC",
    "TWENTYFIVEW",
    "THIRTYFTENO",
    "MINUTESETOU",
    "PASTORUNINE",
    "ONESIXTHREE",
    "FOURFIVETWO",
    "EIGHTELEVEN",
    "SEVENTWELVE",
    "TENSEOCLOCK"
  ];

  var ZH_ROWS = [
    "现在是凌晨上午中午下午",
    "夜里晚上一二三四五六七",
    "八九十一十二点整半一刻",
    "二十三十刻四十五十五分"
  ];

  /* 英文词 -> [行, 列] */
  var EN_WORDS = {
    IT: [[0,0],[0,1]], IS: [[0,3],[0,4]],
    FIVE_M: [[2,6],[2,7],[2,8],[2,9]],
    TEN_M: [[3,7],[3,8],[3,9]],
    FIFTEEN: [[1,2],[1,3],[1,4],[1,5],[1,6],[1,7],[1,8]],
    TWENTY: [[2,0],[2,1],[2,2],[2,3],[2,4],[2,5]],
    THIRTY: [[3,0],[3,1],[3,2],[3,3],[3,4],[3,5]],
    MINUTES: [[4,0],[4,1],[4,2],[4,3],[4,4],[4,5],[4,6]],
    PAST: [[5,0],[5,1],[5,2],[5,3]],
    TO: [[4,8],[4,9]],
    OCLOCK: [[10,5],[10,6],[10,7],[10,8],[10,9],[10,10]],
    H1: [[6,0],[6,1],[6,2]],
    H2: [[7,8],[7,9],[7,10]],
    H3: [[6,6],[6,7],[6,8],[6,9],[6,10]],
    H4: [[7,0],[7,1],[7,2],[7,3]],
    H5: [[7,4],[7,5],[7,6],[7,7]],
    H6: [[6,3],[6,4],[6,5]],
    H7: [[9,0],[9,1],[9,2],[9,3],[9,4]],
    H8: [[8,0],[8,1],[8,2],[8,3],[8,4]],
    H9: [[5,7],[5,8],[5,9],[5,10]],
    H10: [[10,0],[10,1],[10,2]],
    H11: [[8,5],[8,6],[8,7],[8,8],[8,9],[8,10]],
    H12: [[9,5],[9,6],[9,7],[9,8],[9,9],[9,10]]
  };

  /* 中文词 -> [行, 列] */
  var ZH_WORDS = {
    PRE: [[0,0],[0,1],[0,2]],          // 现在是
    P0: [[0,3],[0,4]],                // 凌晨
    P1: [[0,5],[0,6]],                // 上午
    P2: [[0,7],[0,8]],                // 中午
    P3: [[0,9],[0,10]],               // 下午
    P4: [[1,2],[1,3]],                // 晚上
    P5: [[1,0],[1,1]],                // 夜里
    DOT: [[2,6]],                     // 点
    ZHENG: [[2,7]],                   // 整
    BAN: [[2,8]],                     // 半
    YI15: [[2,9]], KE15: [[2,10]],    // 一刻
    H1: [[1,4]], H2: [[1,5]], H3: [[1,6]], H4: [[1,7]],
    H5: [[1,8]], H6: [[1,9]], H7: [[1,10]],
    H8: [[2,0]], H9: [[2,1]], H10: [[2,2]],
    H11: [[2,2],[2,3]], H12: [[2,4],[2,5]],
    T20: [[3,0],[3,1]],               // 二十
    T30: [[3,2],[3,3]],               // 三十
    S3: [[3,2]], KE45: [[3,4]],       // 三刻
    T40: [[3,5],[3,6]],               // 四十
    T50: [[3,7],[3,8]],               // 五十
    TEN1: [[3,8]],                    // 十(个位)
    FIVE1: [[3,9]],                   // 五(个位)
    FEN: [[3,10]]                     // 分
  };

  var grid = document.getElementById('grid');
  var hint = document.getElementById('hint');
  var langZhBtn = document.getElementById('langZh');
  var langEnBtn = document.getElementById('langEn');
  var dotsBox = document.getElementById('themeDots');
  var THEMES = ['amber', 'green', 'blue', 'red', 'white'];
  var precSeg = document.getElementById('precSeg');
  var secToggle = document.getElementById('secToggle');
  var debugToggle = document.getElementById('debugToggle');
  var secRow = document.getElementById('secRow');
  var secWords = document.getElementById('secWords');
  var cdots = [0, 1, 2, 3].map(function (i) { return document.getElementById('cdot' + i); });

  var lang = 'zh';
  var precision = 5;      // 1 | 5 | 10 | 15
  var showSeconds = false;
  var cells = [];

  /* 秒数 -> 文字 */
  var EN_ONES = ['ZERO', 'ONE', 'TWO', 'THREE', 'FOUR', 'FIVE', 'SIX', 'SEVEN', 'EIGHT', 'NINE'];
  var EN_TEENS = ['TEN', 'ELEVEN', 'TWELVE', 'THIRTEEN', 'FOURTEEN', 'FIFTEEN', 'SIXTEEN', 'SEVENTEEN', 'EIGHTEEN', 'NINETEEN'];
  var EN_TENS = ['', '', 'TWENTY', 'THIRTY', 'FORTY', 'FIFTY'];
  function enSecondWord(s) {
    var w;
    if (s < 10) w = EN_ONES[s];
    else if (s < 20) w = EN_TEENS[s - 10];
    else w = EN_TENS[Math.floor(s / 10)] + (s % 10 ? ' ' + EN_ONES[s % 10] : '');
    return w + (s === 1 ? ' SECOND' : ' SECONDS');
  }
  var ZH_DIG = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
  function zhSecondWord(s) {
    var w;
    if (s < 10) w = ZH_DIG[s];
    else w = (s < 20 ? '' : ZH_DIG[Math.floor(s / 10)]) + '十' + (s % 10 ? ZH_DIG[s % 10] : '');
    return w + '秒';
  }

  function buildGrid(rows) {
    grid.innerHTML = '';
    cells = [];
    rows.forEach(function (row) {
      for (var i = 0; i < row.length; i++) {
        var d = document.createElement('div');
        d.className = 'cell';
        d.textContent = row[i];
        grid.appendChild(d);
        cells.push(d);
      }
    });
  }

  function light(words, names) {
    var on = {};
    names.forEach(function (n) {
      (words[n] || []).forEach(function (p) { on[p[0] * 11 + p[1]] = true; });
    });
    for (var i = 0; i < cells.length; i++) {
      cells[i].classList.toggle('on', !!on[i]);
    }
  }

  function enNames(h, m, prec) {
    var names = ['IT', 'IS'];
    if (m === 0) {
      names.push('H' + h, 'OCLOCK');
      return names;
    }
    var MIN;
    if (prec === 10) {
      MIN = { 10: ['TEN_M'], 20: ['TWENTY'], 30: ['THIRTY'], 40: ['TWENTY'], 50: ['TEN_M'] }[m];
    } else if (prec === 15) {
      MIN = { 15: ['FIFTEEN'], 30: ['THIRTY'], 45: ['FIFTEEN'] }[m];
    } else {
      MIN = {
        5: ['FIVE_M'], 10: ['TEN_M'], 15: ['FIFTEEN'],
        20: ['TWENTY'], 25: ['TWENTY', 'FIVE_M'], 30: ['THIRTY'],
        35: ['TWENTY', 'FIVE_M'], 40: ['TWENTY'], 45: ['FIFTEEN'],
        50: ['TEN_M'], 55: ['FIVE_M']
      }[m];
    }
    names = names.concat(MIN);
    if (m !== 30) names.push('MINUTES');
    if (m <= 30) {
      names.push('PAST', 'H' + h);
    } else {
      names.push('TO', 'H' + (h % 12 + 1));
    }
    return names;
  }

  function zhNames(h24, m, prec) {
    var names = ['PRE'];
    names.push(
      h24 <= 5 ? 'P0' :
      h24 <= 10 ? 'P1' :
      h24 <= 13 ? 'P2' :
      h24 <= 17 ? 'P3' :
      h24 <= 22 ? 'P4' : 'P5'
    );
    names.push('H' + (h24 % 12 || 12), 'DOT');
    var MIN;
    if (prec === 10) {
      MIN = {
        0: ['ZHENG'], 10: ['TEN1', 'FEN'], 20: ['T20', 'FEN'],
        30: ['BAN'], 40: ['T40', 'FEN'], 50: ['T50', 'FEN']
      }[m];
    } else if (prec === 15) {
      MIN = {
        0: ['ZHENG'], 15: ['YI15', 'KE15'],
        30: ['BAN'], 45: ['S3', 'KE45']
      }[m];
    } else {
      MIN = {
        0: ['ZHENG'],
        5: ['FIVE1', 'FEN'],
        10: ['TEN1', 'FEN'],
        15: ['YI15', 'KE15'],      // 一刻
        20: ['T20', 'FEN'],
        25: ['T20', 'FIVE1', 'FEN'],
        30: ['BAN'],               // 半
        35: ['T30', 'FIVE1', 'FEN'],
        40: ['T40', 'FEN'],
        45: ['S3', 'KE45'],        // 三刻
        50: ['T50', 'FEN'],
        55: ['T50', 'FIVE1', 'FEN']
      }[m];
    }
    return names.concat(MIN);
  }

  var lastKey = '';
  var simTime = null;   // 调试模式下的模拟时间
  var lastReal = 0;
  var debugOn = false;
  var DEBUG_SPEED = 60; // 调试：1 真实秒 = 60 时钟秒
  function tick() {
    var realNow = new Date();
    var now;
    if (debugOn) {
      if (!simTime) { simTime = new Date(realNow.getTime()); lastReal = realNow.getTime(); }
      var dt = realNow.getTime() - lastReal;
      lastReal = realNow.getTime();
      simTime = new Date(simTime.getTime() + dt * DEBUG_SPEED);
      now = simTime;
    } else {
      now = realNow;
    }
    var totalMin = now.getHours() * 60 + now.getMinutes();
    var h, m, dots = 0;
    if (precision === 1) {
      /* 1分钟模式：文字向下取整到5分钟，四角圆点补 +1~4 */
      var base = Math.floor(totalMin / 5) * 5;
      h = Math.floor(base / 60) % 24;
      m = base % 60;
      dots = totalMin - base;
    } else {
      var rounded = Math.round(totalMin / precision) * precision;
      h = Math.floor(rounded / 60) % 24;
      m = rounded % 60;
    }
    var key = lang + '|' + precision + '|' + h + '|' + m + '|' + dots;
    if (key !== lastKey) {
      lastKey = key;
      if (lang === 'en') {
        light(EN_WORDS, enNames(h % 12 || 12, m, precision));
      } else {
        light(ZH_WORDS, zhNames(h, m, precision));
      }
      updateDots(dots);
    }
    if (showSeconds) updateSeconds(now);
  }

  function updateDots(n) {
    for (var i = 0; i < 4; i++) {
      cdots[i].classList.toggle('on', precision === 1 && i < n);
    }
  }

  function updateSeconds(now) {
    var s = now.getSeconds();
    var txt = lang === 'en' ? enSecondWord(s) : zhSecondWord(s);
    if (secWords.textContent !== txt) secWords.textContent = txt;
  }

  function updateHint() {
    var zh = lang === 'zh';
    hint.textContent = {
      1: zh ? '一分钟精度 · 角点为+1~4分' : '1-MINUTE PRECISION · DOTS +1-4',
      5: zh ? '五分钟精度' : '5-MINUTE PRECISION',
      10: zh ? '十分钟精度' : '10-MINUTE PRECISION',
      15: zh ? '十五分钟精度' : '15-MINUTE PRECISION'
    }[precision];
  }

  function setPrecision(p) {
    p = parseInt(p, 10);
    if ([1, 5, 10, 15].indexOf(p) === -1) p = 5;
    precision = p;
    precSeg.querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('active', parseInt(b.getAttribute('data-p'), 10) === p);
    });
    lastKey = '';
    updateHint();
    try { localStorage.setItem('wordclock-precision', String(p)); } catch (e) {}
    tick();
  }

  function setSeconds(on) {
    showSeconds = !!on;
    secRow.hidden = !showSeconds;
    secToggle.classList.toggle('active', showSeconds);
    secToggle.textContent = showSeconds ? '读秒 开' : '读秒 关';
    try { localStorage.setItem('wordclock-seconds', showSeconds ? '1' : '0'); } catch (e) {}
    if (showSeconds) tick();
  }

  function setDebug(on) {
    debugOn = !!on;
    simTime = null; // 重置模拟时间，关闭后回到真实时间
    debugToggle.classList.toggle('active', debugOn);
    debugToggle.textContent = debugOn ? '调试 开' : '调试 关';
    lastKey = '';
    tick();
  }

  function setLang(next) {
    lang = next;
    document.documentElement.setAttribute('data-lang', next);
    buildGrid(next === 'en' ? EN_ROWS : ZH_ROWS);
    langZhBtn.classList.toggle('active', next === 'zh');
    langEnBtn.classList.toggle('active', next === 'en');
    lastKey = '';
    updateHint();
    try { localStorage.setItem('wordclock-lang', next); } catch (e) {}
    tick();
  }

  function setTheme(next) {
    if (THEMES.indexOf(next) === -1) next = 'amber';
    document.documentElement.setAttribute('data-theme', next);
    dotsBox.querySelectorAll('.dot').forEach(function (d) {
      d.classList.toggle('active', d.getAttribute('data-t') === next);
    });
    try { localStorage.setItem('wordclock-theme', next); } catch (e) {}
  }

  langZhBtn.addEventListener('click', function () { setLang('zh'); });
  langEnBtn.addEventListener('click', function () { setLang('en'); });
  dotsBox.addEventListener('click', function (e) {
    var t = e.target && e.target.getAttribute && e.target.getAttribute('data-t');
    if (t) setTheme(t);
  });
  precSeg.addEventListener('click', function (e) {
    var p = e.target && e.target.getAttribute && e.target.getAttribute('data-p');
    if (p) setPrecision(p);
  });
  secToggle.addEventListener('click', function () { setSeconds(!showSeconds); });
  debugToggle.addEventListener('click', function () { setDebug(!debugOn); });

  /* 恢复上次选择 */
  var savedLang = 'zh', savedTheme = 'amber', savedPrec = '5', savedSec = '0';
  try {
    savedLang = localStorage.getItem('wordclock-lang') || 'zh';
    savedTheme = localStorage.getItem('wordclock-theme') || 'amber';
    savedPrec = localStorage.getItem('wordclock-precision') || '5';
    savedSec = localStorage.getItem('wordclock-seconds') || '0';
  } catch (e) {}
  if (savedLang !== 'zh' && savedLang !== 'en') savedLang = 'zh';

  setTheme(savedTheme);
  /* 先建格子再设语言，避免 buildGrid 两次 */
  lang = savedLang;
  document.documentElement.setAttribute('data-lang', lang);
  buildGrid(lang === 'en' ? EN_ROWS : ZH_ROWS);
  langZhBtn.classList.toggle('active', lang === 'zh');
  langEnBtn.classList.toggle('active', lang === 'en');
  setPrecision(savedPrec);
  setSeconds(savedSec === '1');
  tick();
  setInterval(tick, 250);
})();
</script>
</body>
</html>
