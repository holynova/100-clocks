 const lightWindow=el('g',{'clip-path':`url(#letter-face-${d})`},light),columns=[];
 for(let c=0;c<5;c++){
  const px=x+c*cell,rail=el('g',{class:'rail','data-column':c,'data-rows':tapeRows},g);
  const emitter=el('g',{class:'rail'},lightWindow);

  for(let r=0;r<tapeRows.length;r++)if(tapeRows[r]==='1'){
   const hole=`M${px+1} ${r*cell+1}h12v12h-12z`;outline+=hole;openings.push(hole);edges.push(`M${px+1} ${r*cell+13}h12v-12`);
  }
  el('path',{d:outline,fill:'var(--rail)','fill-rule':'evenodd',stroke:'var(--rail-edge)','stroke-width':.45,filter:'url(#shadow)','data-grid':'perforated'},rail);

// A readable word phase followed by complete glyph/position coverage and mixed stress frames.
const demoWords=['HELLO','WORLD','SLIDER','CLOCK','GRID','NEON','QUICK','BROWN','FOX','JUMPS','OVER','LAZY','DOG','THE','ALPHA','BETA','GAMMA','DELTA','OMEGA','PIXEL','MATRIX','RAILS'];
const demoCharset=demoCharacters+' ';
function buildDemoFrames(){
 const frames=demoWords.map(word=>({text:word.padEnd(6,' '),kind:'词语',label:word}));
 for(const ch of demoCharset)frames.push({text:ch.repeat(6),kind:'字符覆盖',label:ch===' '?'空格':ch});
 // Six rotated passes place adjacent mixed characters in every character slot.
 for(let shift=0;shift<6;shift++)for(let start=0;start<demoCharset.length;start+=6){
  const text=Array.from({length:6},(_,slot)=>demoCharset[(start+slot+shift)%demoCharset.length]).join('');
  frames.push({text,kind:'混合测试',label:text.trim()||'空格'});
 }
 return frames;
}
const demoFrames=buildDemoFrames();
let displayMode='text',message='HELLO!',demoStart=0,demoPaused=false,demoSuspended=false,demoElapsed=0;
function demoTime(now=performance.now()){return demoPaused||demoSuspended?demoElapsed:Math.max(0,now-demoStart);}
function demoIndex(now=performance.now()){return Math.floor(demoTime(now)/1000)%demoFrames.length;}
function demoText(now=performance.now()){return demoFrames[demoIndex(now)].text;}
function demoProgress(){const i=demoIndex(),frame=demoFrames[i];return `${demoPaused?'已暂停 · ':''}${frame.kind} ${i+1}/${demoFrames.length} · ${frame.label} · 每秒一词`;}
let mode='live',last='',showSeconds=false,paused=false;
let speed=60,anchorMs=Date.now(),anchorTick=performance.now();
const $=id=>document.getElementById(id);
const secondScrews=[];
for(const t of tapes)if(t.d>=4)secondScrews.push(t.frame);
const secondColon=el('g',{fill:'url(#orange)'},$('colon'));
for(const y of[266,302])el('rect',{x:575,y,width:12,height:12},secondColon);
function formatTime(date,seconds=showSeconds){return [date.getHours(),date.getMinutes(),...(seconds?[date.getSeconds()]:[])].map(n=>String(n).padStart(2,'0')).join(':');}
function simulationMs(now=performance.now()){return anchorMs+(paused?0:Math.max(0,now-anchorTick)*speed);}
function reanchor(){anchorMs=simulationMs();anchorTick=performance.now();}
function currentDate(){return new Date(mode==='test'?simulationMs():Date.now());}

let introActive=false,introTimers=[];
function cancelIntro(){
 if(!introActive)return;
 introActive=false;introTimers.forEach(clearTimeout);introTimers=[];
 $('clock').dataset.phase='live';updateMotion();
}
function startIntro(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){$('clock').dataset.phase='live';tick(true);return;}
 introActive=true;
 $('clock').dataset.phase='zero';
 render(displayMode==='clock'?(showSeconds?'00:00:00':'00:00'):'000000',true);
 // Let the zero position paint before enabling the opening slide.
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  if(!introActive)return;
  introTimers.push(setTimeout(()=>{
   if(!introActive)return;
   $('clock').dataset.phase='sliding';
   $('clock').style.setProperty('--slide-duration','1.2s');
   tick(false,true);
   introTimers.push(setTimeout(()=>{
    introActive=false;introTimers=[];
    $('clock').dataset.phase='live';updateMotion();tick();
   },1260));
  },300));
 }));
}
function updateMotion(){const duration=displayMode==='demo'?.65:displayMode!=='clock'?1.1:mode==='test'&&!paused?Math.min(.75,(showSeconds?1:60)/speed*.65):.75;$('clock').style.setProperty('--slide-duration',`${duration}s`);}
function render(value,instant=false){
 if(value===last)return;last=value;const characters=displayMode==='clock'?value.replaceAll(':',''):value;
 for(const t of tapes){const character=characters[t.d]||' ';
  for(const column of t.columns){const offset=offsets[character][column.c];if(offset<0)throw new Error('Missing glyph on fixed tape');
   const transform=`translateY(${252-offset*cell}px)`;
   if(instant){column.rail.style.transition='none';column.emitter.style.transition='none';}
   column.rail.style.transform=column.emitter.style.transform=transform;
   if(instant)requestAnimationFrame(()=>requestAnimationFrame(()=>{column.rail.style.transition='';column.emitter.style.transition='';}));
  }
 }
 $('clockTitle').textContent=displayMode==='clock'?`${value}，${mode==='live'?'当前时间':'测试时间'}`:`栅格文字：${value.trim()||'空格'}`;
 $('accessibleTime').textContent=value.trim();$('clock').dataset.time=value;$('clock').dataset.display=displayMode;
}
function tick(instant=false,allowIntro=false){if(introActive&&!allowIntro)return;const date=currentDate();$('date').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(date);render(displayMode==='clock'?formatTime(date):displayMode==='demo'?demoText():message.padEnd(6,' '),instant);if(displayMode==='demo'){$('message').value=demoText().trimEnd()||' ';$('carouselStatus').textContent=demoProgress();$('status').textContent=demoProgress();}if(displayMode==='clock')$('accessibleTime').dateTime=date.toISOString();else $('accessibleTime').removeAttribute('datetime');}
function updateStatus(){if(displayMode!=='clock'){$('status').textContent=displayMode==='demo'?demoProgress():'正在显示文字';$('note').textContent='5×5 字形 · 每列一条固定镂空滑轨 · 6 个字符位';updateMotion();return;}$('status').textContent=mode==='live'?'正在走时':paused?'测试已暂停':`${speed} 倍快进`;$('note').textContent=mode==='live'?(showSeconds?'每一秒，换一种排列。':'每一分钟，换一种排列。'):`${paused?'已暂停':'时间以 '+speed+' 倍速度流逝'}，点击「实时」返回。`;updateMotion();}
function layout(){
 const clockMode=displayMode==='clock',six=!clockMode||showSeconds;
 for(const t of tapes){const shift=clockMode?0:-34*Math.floor(t.d/2);for(const g of [t.g,t.plate,t.light,t.frame])g.setAttribute('transform',`translate(${shift} 0)`);const hidden=t.d>=4&&!six;t.g.style.display=t.plate.style.display=t.light.style.display=t.frame.style.display=hidden?'none':'';}
 $('colon').style.display=clockMode?'':'none';secondColon.style.display=showSeconds?'':'none';
 $('clock').setAttribute('viewBox',`90 ${viewTop} ${clockMode?(six?765:527):697} ${viewHeight}`);$('clock').classList.toggle('seconds-visible',six);$('clock').style.setProperty('--view-ratio',`${clockMode?(six?765:527):697} / ${viewHeight}`);
 $('window').firstElementChild.setAttribute('width',six?688:450);
 const housing=$('housing');housing.children[0].setAttribute('width',clockMode?(six?713:475):645);housing.children[1].setAttribute('d',`M113 236h${clockMode?(six?710:472):642}`);housing.children[2].setAttribute('d',`M${clockMode?(six?825:587):757} 236v102`);
 $('seconds').disabled=!clockMode;
}
function updateSeconds(){cancelIntro();showSeconds=$('seconds').checked;layout();last='';updateStatus();tick(true);}
function setDisplay(next){
 cancelIntro();displayMode=next;last='';if(next==='demo'){$('glyphError').textContent='';$('message').removeAttribute('aria-invalid');demoStart=performance.now();demoElapsed=0;demoPaused=false;demoSuspended=document.hidden;$('glyphPause').textContent='暂停轮播';$('glyphPause').setAttribute('aria-pressed','false');}
 $('glyphPanel').hidden=next==='clock';$('glyphPause').hidden=next!=='demo';$('glyphStop').hidden=next!=='demo';$('carouselStatus').hidden=next!=='demo';

 $('glyphDemo').setAttribute('aria-pressed',String(next==='demo'));$('glyphDemo').textContent=next==='demo'?'重新开始轮播':'开始轮播 · 1 秒/词';layout();updateStatus();tick();
}
function startTest(){cancelIntro();const value=$('startTime').value;if(!/^\d{2}:\d{2}(:\d{2})?$/.test(value)){$('startTime').reportValidity();return;}const parts=value.split(':').map(Number);const date=new Date();date.setHours(parts[0],parts[1],parts[2]||0,0);anchorMs=date.getTime();anchorTick=performance.now();paused=false;$('pause').textContent='暂停';$('pause').setAttribute('aria-pressed','false');updateStatus();tick(true);}

$('seconds').onchange=updateSeconds;$('live').onclick=()=>setMode('live');$('test').onclick=()=>{if(mode!=='test'){$('startTime').value=formatTime(new Date(),true);setMode('test');}};
$('speed').onchange=()=>{reanchor();speed=Number($('speed').value);updateStatus();tick();};

const settings=$('settings'),stage=document.querySelector('.stage');
function openSettings(){if(!settings.open){settings.showModal();$('menuButton').setAttribute('aria-expanded','true');}}
function closeSettings(){settings.close();}
settings.addEventListener('close',()=>{$('menuButton').setAttribute('aria-expanded','false');});
$('menuButton').onclick=openSettings;$('closeMenu').onclick=closeSettings;
settings.addEventListener('click',e=>{if(e.target===settings){const r=settings.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeSettings();}});
$('pureMode').onchange=()=>{const pure=$('pureMode').checked;document.body.classList.toggle('pure-mode',pure);stage.tabIndex=pure?0:-1;if(pure){stage.setAttribute('role','button');stage.setAttribute('aria-label','时钟，轻点或按回车打开设置');closeSettings();stage.focus({preventScroll:true});}else{stage.removeAttribute('role');stage.setAttribute('aria-label','滑轨时钟');}};
stage.addEventListener('click',()=>{if(document.body.classList.contains('pure-mode'))openSettings();});

$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();closeSettings();}else{$('pureMode').checked=true;$('pureMode').dispatchEvent(new Event('change'));}}catch{$('note').textContent='当前浏览器暂不支持全屏显示。';}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!settings.open&&document.body.classList.contains('pure-mode')){e.preventDefault();openSettings();}});
document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏显示';});
document.addEventListener('visibilitychange',()=>{if(displayMode==='demo'){if(document.hidden){demoElapsed=demoTime();demoSuspended=true;}else{demoStart=performance.now()-demoElapsed;demoSuspended=false;}}if(!document.hidden)tick();});
$('startTime').value=formatTime(new Date(),true);$('startTime').required=true;updateSeconds();setDisplay('demo');startIntro();setInterval(()=>tick(),100);
