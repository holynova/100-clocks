<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script
  defer
  src="https://cloud.umami.is/script.js"
  data-website-id="e01c9f78-4607-4e60-b01c-77c8190b12b4"
  data-domains="holynova.github.io"
  data-exclude-search="true"
  data-exclude-hash="true"
></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Slider</title>
<style>
  :root {
    --t: clamp(10px, 2.6vmin, 20px);
    --gap: calc(var(--t) * 0.14);
    --row: calc(var(--t) + var(--gap));
    /* 橙色背光（钟面行）位于视口约 36% 高度处 */
    --digit-top: calc(36dvh - var(--row) * 5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    min-height: 100dvh;
    overflow: hidden;
    background: radial-gradient(circle at 50% 32%, #f3f3f3 0%, #e1e1e1 55%, #cccccc 100%);
    font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  }

  .nav {
    position: fixed;
    top: 16px; left: 20px; z-index: 50;
    display: flex; gap: 18px;
  }
  .nav a {
    color: rgba(20, 20, 20, 0.42);
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
    transition: color 0.2s;
  }
  .nav a:hover { color: rgba(20, 20, 20, 0.85); }
  .nav .current { color: rgba(20, 20, 20, 0.85); cursor: default; }

  /* 机身横梁 */
  .band {
    position: fixed;
    left: 0; right: 0; z-index: 1;
    top: calc(var(--digit-top) - var(--row) * 2);
    height: calc(var(--row) * 9 - var(--gap));
    background: linear-gradient(180deg, #3b3e3e 0%, #2b2d2d 60%, #232525 100%);
    box-shadow: 0 calc(var(--t) * 0.35) calc(var(--t) * 1.1) rgba(0, 0, 0, 0.28);
  }

  .clock {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: calc(var(--t) * 1.1);
    margin-top: var(--digit-top);
  }

  .digit {
    position: relative;
    width: calc(var(--t) * 3 + var(--gap) * 2);
    height: calc(var(--row) * 60 - var(--gap));
  }

  /* 橙色背光：固定不动 */
  .backlight {
    position: absolute;
    z-index: 1;
    top: calc(var(--row) * 5);
    left: 0;
    width: calc(var(--t) * 3 + var(--gap) * 2);
    height: calc(var(--row) * 5 - var(--gap));
    background: radial-gradient(circle at 50% 38%, #f28a2e 0%, #e56f16 55%, #cc5c0d 100%);
    box-shadow: 0 0 calc(var(--t) * 1.2) rgba(229, 111, 22, 0.55);
    border-radius: 2px;
  }

  /* 网格板：高条，上下滑动 */
  .strip {
    position: absolute;
    top: 0;
    display: grid;
    grid-template-columns: repeat(2, var(--t));
    grid-auto-rows: var(--t);
    gap: var(--gap);
    background: #0d0d0d;
    padding: calc(var(--gap) / 2);
    border-radius: 3px;
    box-shadow:
      calc(var(--t) * 0.22) calc(var(--t) * 0.3) calc(var(--t) * 0.55) rgba(0, 0, 0, 0.22);
    will-change: transform;
    transition: transform 0.9s cubic-bezier(0.6, 0.04, 0.3, 1);
  }
  .strip-l { left: 0; z-index: 3; }
  .strip-r { left: calc(var(--t) + var(--gap)); z-index: 2; transition-delay: 0.14s; }

  .cell {
    width: var(--t);
    height: var(--t);
    border-radius: 1.5px;
  }
  .cell.closed {
    background: #161616;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.06);
  }
  .cell.open { background: transparent; }

  .colon {
    display: grid;
    grid-template-rows: repeat(2, var(--t));
    gap: calc(var(--row) * 1.6);
    margin-top: calc(var(--row) * 5 + var(--row) * 1.2);
  }
  .colon i {
    width: var(--t);
    height: var(--t);
    border-radius: 2px;
    background: radial-gradient(circle at 50% 38%, #f28a2e 0%, #d05f0e 100%);
    box-shadow: 0 0 calc(var(--t) * 0.7) rgba(229, 111, 22, 0.6);
  }

  @media (max-width: 480px) {
    .nav { top: 14px; left: 14px; gap: 14px; }
  }
</style>
</head>
<body>
  <nav class="nav" aria-label="其他时钟">
    <a href="index.html">Matrix</a>
    <a href="clock3.html">Sport</a>
    <a href="word-clock.html">Word</a>
    <span class="current">Slider</span>
  </nav>

  <div class="band" aria-hidden="true"></div>

  <main class="clock" aria-label="Time Slider">
    <div class="digit" data-i="0">
      <div class="backlight"></div>
      <div class="strip strip-r"></div>
      <div class="strip strip-l"></div>
    </div>
    <div class="digit" data-i="1">
      <div class="backlight"></div>
      <div class="strip strip-r"></div>
      <div class="strip strip-l"></div>
    </div>
    <div class="colon" aria-hidden="true"><i></i><i></i></div>
    <div class="digit" data-i="2">
      <div class="backlight"></div>
      <div class="strip strip-r"></div>
      <div class="strip strip-l"></div>
    </div>
    <div class="digit" data-i="3">
      <div class="backlight"></div>
      <div class="strip strip-r"></div>
      <div class="strip strip-l"></div>
    </div>
  </main>

<script>
(function () {
  "use strict";

  /* 数字网格：3 列 × 5 行，与实物照片完全一致（0/2/4/6 逐格读取，其余同风格补齐） */
  var DIGITS = {
    "0": ["OOO", "O.O", "O.O", "O.O", "OOO"],
    "1": ["..O", "..O", "..O", "..O", "..O"],
    "2": ["OOO", "..O", "OOO", "O..", "OOO"],
    "3": ["OOO", "..O", "OOO", "..O", "OOO"],
    "4": ["O.O", "O.O", "OOO", "..O", "..O"],
    "5": ["OOO", "O..", "OOO", "..O", "OOO"],
    "6": ["OOO", "O..", "OOO", "O.O", "OOO"],
    "7": ["OOO", "..O", "..O", "..O", "..O"],
    "8": ["OOO", "O.O", "OOO", "O.O", "OOO"],
    "9": ["OOO", "O.O", "OOO", "..O", "OOO"]
  };

  var ROWS = 5;        // 每帧行数
  var FRAMES = 10;     // 0-9
  var LEAD_L = 5;      // 左板前导黑行
  var LEAD_R = 8;      // 右板前导黑行（比左板低 3 行，还原照片里的错位）
  var TRAIL = 5;
  var R_OFFSET = LEAD_R - LEAD_L; // 3

  /* 每位数字两块网格板：左板取数字第 1-2 列，右板取第 2-3 列 */
  function buildStrip(el, colIdx, lead) {
    var total = lead + FRAMES * ROWS + TRAIL;
    var html = "";
    for (var r = 0; r < total; r++) {
      var d = -1, fr = 0;
      if (r >= lead && r < lead + FRAMES * ROWS) {
        d = Math.floor((r - lead) / ROWS);
        fr = (r - lead) % ROWS;
      }
      for (var c = 0; c < 2; c++) {
        var open = d >= 0 && DIGITS[String(d)][fr][colIdx[c]] === "O";
        html += '<i class="cell' + (open ? " open" : " closed") + '"></i>';
      }
    }
    el.innerHTML = html;
  }

  var digits = Array.prototype.slice.call(document.querySelectorAll(".digit"));
  var stripsL = [], stripsR = [];
  digits.forEach(function (dig) {
    var l = dig.querySelector(".strip-l");
    var r = dig.querySelector(".strip-r");
    buildStrip(l, [0, 1], LEAD_L);
    buildStrip(r, [1, 2], LEAD_R);
    stripsL.push(l);
    stripsR.push(r);
  });

  var rowH = 0;
  function measure() {
    var cell = stripsL[0].querySelector(".cell");
    var gap = parseFloat(getComputedStyle(stripsL[0]).rowGap) || 0;
    rowH = cell.getBoundingClientRect().height + gap;
  }

  function setDigit(i, d) {
    stripsL[i].style.transform = "translateY(" + (-d * ROWS * rowH) + "px)";
    stripsR[i].style.transform = "translateY(" + (-(d * ROWS + R_OFFSET) * rowH) + "px)";
  }

  var lastMin = -1;
  function tick() {
    var n = new Date();
    var hh = ("0" + n.getHours()).slice(-2);
    var mm = ("0" + n.getMinutes()).slice(-2);
    var key = hh + mm;
    if (key === lastMin) return;
    lastMin = key;
    var s = hh + mm;
    for (var i = 0; i < 4; i++) setDigit(i, +s[i]);
  }

  measure();
  tick(); // 初次从 0 位滑到当前时间
  setInterval(tick, 1000);

  var rT;
  window.addEventListener("resize", function () {
    clearTimeout(rT);
    rT = setTimeout(function () {
      measure();
      lastMin = -1;
      tick();
    }, 150);
  });
})();
</script>
</body>
</html>
